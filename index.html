<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>운빨 테스트! 100층 엘리베이터</title>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Sans+KR:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0a1a;--glass:rgba(255,255,255,.06);--line:rgba(255,255,255,.14);--tx:#ecebff;--mut:#9a98c4;
--pur:#8b5cf6;--blu:#5865f2;--cy:#4de3ff;--ok:#3ddc97;--bad:#ff4d6d}
*{box-sizing:border-box;margin:0}
html,body{min-height:100%}
body{background:radial-gradient(900px 500px at 15% -10%,rgba(139,92,246,.35),transparent 60%),
radial-gradient(800px 500px at 100% 10%,rgba(88,101,242,.3),transparent 60%),var(--bg);
color:var(--tx);font:400 16px/1.5 'IBM Plex Sans KR',system-ui,sans-serif;padding:16px;
padding-top:max(16px,env(safe-area-inset-top));padding-bottom:max(16px,env(safe-area-inset-bottom))}
main{max-width:560px;margin:0 auto}
h1,.big{font-family:'Black Han Sans','IBM Plex Sans KR',sans-serif;font-weight:400}
.glass{background:var(--glass);border:1px solid var(--line);border-radius:18px;padding:20px;
backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 8px 40px rgba(88,101,242,.18)}
.screen{display:none}.screen.on{display:block}
.title{text-align:center;margin:18px 0 20px}
.title h1{font-size:clamp(30px,8vw,44px);line-height:1.1;text-shadow:0 0 24px rgba(139,92,246,.8)}
.title p{color:var(--mut);margin-top:6px}
input{width:100%;padding:13px 14px;margin-bottom:10px;border-radius:12px;border:1px solid var(--line);
background:rgba(0,0,0,.35);color:var(--tx);font:inherit;outline:none}
input:focus-visible,button:focus-visible{outline:2px solid var(--cy);outline-offset:2px}
button{font:inherit;cursor:pointer;color:var(--tx)}
.btn{width:100%;padding:13px;border-radius:12px;border:0;font-weight:600;
background:linear-gradient(135deg,var(--pur),var(--blu));box-shadow:0 0 22px rgba(139,92,246,.5)}
.btn.ghost{background:var(--glass);border:1px solid var(--line);box-shadow:none}
.btn.danger{background:linear-gradient(135deg,#ff4d6d,#c026d3)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.err{color:var(--bad);min-height:24px;font-size:14px}
.center{text-align:center}.mut{color:var(--mut)}
.pulse{display:inline-block;width:12px;height:12px;border-radius:50%;background:var(--cy);
box-shadow:0 0 14px var(--cy);animation:pl 1.2s infinite}
@keyframes pl{50%{opacity:.25;transform:scale(.7)}}
/* 관리자 패널 */
#admin{display:none;margin-bottom:14px;border-color:rgba(77,227,255,.5)}
#admin.on{display:block}
#admin .row{display:flex;gap:8px;margin-top:10px}
#admin .row .btn{padding:10px;font-size:14px}
/* 게임 화면 */
.hud{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
.time{font-family:'Black Han Sans';font-size:30px;font-variant-numeric:tabular-nums}
.time.low{color:var(--bad)}
.bar{height:8px;border-radius:8px;background:rgba(255,255,255,.1);overflow:hidden;margin-bottom:16px}
.bar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,var(--cy),var(--pur))}
.shaft{text-align:center;padding:18px 10px}
.floorLbl{color:var(--mut);font-size:14px}
#floorNum{font-family:'Black Han Sans';font-size:clamp(84px,26vw,130px);line-height:1;color:#fff;
text-shadow:0 0 30px var(--pur),0 0 60px var(--blu)}
#floorNum.up{animation:up .55s ease-out}
#floorNum.fall{animation:fall .8s ease-in forwards;color:var(--bad);text-shadow:0 0 30px var(--bad)}
@keyframes up{0%{transform:translateY(40px);opacity:.2}60%{transform:translateY(-10px);color:var(--ok)}100%{transform:none}}
@keyframes fall{0%{transform:none}15%{transform:translateX(-10px)}30%{transform:translateX(10px)}100%{transform:translateY(60px) scale(.6);opacity:.35}}
.prog{height:6px;border-radius:6px;background:rgba(255,255,255,.1);margin:10px 0 0;overflow:hidden}
.prog i{display:block;height:100%;width:1%;background:var(--ok);transition:width .5s}
.doors{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:14px 0}
.door{position:relative;height:170px;overflow:hidden;border-radius:16px 16px 6px 6px;border:1px solid var(--line);
background:rgba(0,0,0,.4);transition:box-shadow .3s,background .3s}
.door::before,.door::after{content:"";position:absolute;top:0;bottom:0;width:50%;transition:transform .45s ease;
background:linear-gradient(180deg,#2b2a55,#161536)}
.door::before{left:0;border-right:1px solid var(--line)}.door::after{right:0}
.door.open::before{transform:translateX(-100%)}.door.open::after{transform:translateX(100%)}
.door.ok{background:rgba(61,220,151,.3);box-shadow:0 0 30px var(--ok)}
.door.bad{background:rgba(255,77,109,.35);box-shadow:0 0 30px var(--bad)}
.door .lbl{position:absolute;inset:0;z-index:2;display:flex;align-items:center;justify-content:center;
font-family:'Black Han Sans';font-size:56px;text-shadow:0 0 18px var(--cy)}
.door:hover:not(:disabled){box-shadow:0 0 24px var(--pur)}
.door:disabled{cursor:default}
#fx{position:fixed;inset:0;pointer-events:none;opacity:0}
#fx.ok{background:radial-gradient(circle,rgba(61,220,151,.4),transparent 70%);animation:fl .6s}
#fx.bad{background:radial-gradient(circle,rgba(255,77,109,.55),transparent 70%);animation:fl .9s}
@keyframes fl{0%{opacity:1}100%{opacity:0}}
.mine{margin-top:14px;padding:16px;text-align:center}
.mine .big{font-size:26px}
/* 랭킹 */
.row{display:grid;grid-template-columns:44px 1fr auto auto;gap:10px;align-items:center;
padding:11px 12px;border-bottom:1px solid var(--line)}
.row:last-child{border:0}
.row.me{background:rgba(139,92,246,.22);border-radius:12px}
.rk{font-family:'Black Han Sans';font-size:20px;text-align:center}
.nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fl{font-weight:600;font-variant-numeric:tabular-nums}
.badge{font-size:12px;padding:3px 9px;border-radius:99px;border:1px solid var(--line);color:var(--mut)}
.badge.cleared{color:var(--ok);border-color:var(--ok)}.badge.cashed{color:var(--cy);border-color:var(--cy)}
.badge.fell{color:var(--bad);border-color:var(--bad)}
@media(min-width:768px){body{padding:32px}.door{height:200px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main>
  <div class="title"><h1>운빨 테스트!<br>100층 엘리베이터</h1><p>제한시간 2분, 문을 골라 최대한 높이 올라가세요</p></div>

  <!-- 관리자 패널 (관리자 코드로 로그인하면 표시) -->
  <section id="admin" class="glass">
    <b>관리자 패널</b> <span class="mut" id="adminInfo"></span>
    <div class="row" style="display:flex">
      <button class="btn" id="bStart">게임 시작</button>
      <button class="btn danger" id="bEnd">지금 종료</button>
      <button class="btn ghost" id="bReset">대기실로 초기화</button>
    </div>
  </section>

  <!-- 1. 로그인 -->
  <section id="login" class="screen on glass">
    <input id="nick" maxlength="12" placeholder="닉네임 (최대 12자)" autocomplete="off">
    <input id="pw" type="password" placeholder="비밀번호 (재접속할 때 본인 확인용)" autocomplete="off">
    <div class="err" id="err"></div>
    <button class="btn" id="bLogin">입장하기</button>
    <button class="btn ghost" id="bToAdmin" style="margin-top:10px">관리자 로그인</button>
  </section>

  <!-- 1-2. 관리자 로그인 (Firebase 이메일 인증) -->
  <section id="adminLogin" class="screen glass">
    <input id="aEmail" type="email" placeholder="관리자 이메일" autocomplete="username">
    <input id="aPw" type="password" placeholder="관리자 비밀번호" autocomplete="current-password">
    <div class="err" id="aErr"></div>
    <button class="btn" id="bAdminLogin">관리자로 입장</button>
    <button class="btn ghost" id="bBack" style="margin-top:10px">돌아가기</button>
  </section>

  <!-- 2. 대기실 -->
  <section id="wait" class="screen glass center">
    <p><span class="pulse"></span></p>
    <p class="big" style="font-size:22px;margin-top:12px" id="waitMsg">관리자가 게임을 시작할 때까지 대기 중입니다...</p>
    <p class="mut" style="margin-top:8px" id="waitSub"></p>
  </section>

  <!-- 3. 게임 -->
  <section id="game" class="screen">
    <div class="hud"><span class="mut">남은 시간</span><span class="time" id="time">2:00</span></div>
    <div class="bar"><i id="bar"></i></div>
    <div class="glass shaft">
      <div class="floorLbl">현재 층</div>
      <div id="floorNum">1</div>
      <div class="prog"><i id="prog"></i></div>
    </div>
    <div id="play">
      <div class="doors">
        <button class="door" id="dA"><span class="lbl">A</span></button>
        <button class="door" id="dB"><span class="lbl">B</span></button>
      </div>
      <button class="btn ghost" id="bCash">중도 포기 &amp; 현재 층수 확정</button>
    </div>
    <div id="done" class="glass mine" style="display:none">
      <div class="big" id="doneTitle"></div>
      <p class="mut" id="doneSub" style="margin-top:6px"></p>
    </div>
  </section>

  <!-- 4. 결과 -->
  <section id="result" class="screen">
    <div class="glass mine" style="margin-bottom:14px"><div class="big" id="myRank">집계 중...</div></div>
    <div class="glass" style="padding:8px"><div id="board"></div></div>
  </section>
</main>
<div id="fx"></div>

<script type="module">
/* =====================================================================
   ★★★ 설정 영역 (여기만 고치면 됩니다) ★★★
   ---------------------------------------------------------------------
   [배포 방법]
   1) https://console.firebase.google.com 에서 프로젝트 생성 (Spark 무료 플랜)
   2) 프로젝트 설정 > 내 앱 > 웹앱(</>) 추가 > 나오는 firebaseConfig 를 아래에 붙여넣기
   3) 빌드 > Authentication > 시작하기 > 로그인 방법 > '이메일/비밀번호' 사용 설정
      그다음 '사용자' 탭 > 사용자 추가 로 관리자 계정(이메일+비밀번호)을 만드세요.
      (이 이메일을 아래 ADMIN_EMAIL 에 똑같이 적습니다. 비밀번호는 코드에 적지 않아요!)
   4) 빌드 > Firestore Database > 데이터베이스 만들기 > 규칙(Rules)에 아래를 붙여넣고 게시
      ※ 'admin@example.com' 두 곳이 아니라 한 곳만 ADMIN_EMAIL 과 같게 바꾸세요.
        rules_version = '2';
        service cloud.firestore { match /databases/{d}/documents {
          function isAdmin() {
            return request.auth != null && request.auth.token.email == 'admin@example.com';
          }
          // 게임 상태: 누구나 읽기 가능, 시작/종료/초기화(쓰기)는 관리자만 가능
          match /gameState/{doc} { allow read: if true; allow write: if isAdmin(); }
          // 유저 기록
          match /users/{u} { allow read, write: if true; }
        } }
   5) 이 파일을 GitHub 저장소에 index.html 로 올리고 Settings > Pages 에서 배포
   ===================================================================== */
const firebaseConfig = {
    apiKey: "AIzaSyDSGExITe-BnKFHylAUqvvP8GvSVy53vlc",


  authDomain: "pokemingming.firebaseapp.com",


  projectId: "pokemingming",


  storageBucket: "pokemingming.firebasestorage.app",


  messagingSenderId: "1032382958276",


  appId: "1:1032382958276:web:c62cc7827637ae12f99791"


};

/* ★ 관리자 이메일: Firebase Authentication 에 만든 관리자 계정 이메일과 똑같이 적으세요.
   비밀번호는 코드에 없고 Firebase 가 검증합니다. 비밀번호를 바꾸려면 Firebase 콘솔 >
   Authentication > 사용자 에서 비밀번호를 재설정하면 됩니다. */
const ADMIN_EMAIL = "pokepack1010@example.com";

const DURATION = 120; // 제한시간(초)
const MAX_FLOOR = 100; // 최고 층수
/* ===================================================================== */

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, getDoc, getDocFromServer, setDoc, onSnapshot, collection, query, where, serverTimestamp }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);
const gameRef = doc(db, "gameState", "main");
const $ = id => document.getElementById(id);
const LABEL = { cleared: "완주", cashed: "포기", fell: "추락", timeout: "시간종료" };

let offset = 0; // (서버 시간 - 내 기기 시간) 보정값(ms)
let game = { status: "waiting", round: 0, startAt: 0 };
let me = null, isAdmin = false, play = null, busy = false, unsubBoard = null, boardRound = null, adminEnded = false;
const nowS = () => Date.now() + offset; // 서버 기준 현재 시각
const endAt = () => game.startAt + DURATION * 1000; // 종료 절대시각

/* ---------- 화면 전환 ---------- */
function show(id) { document.querySelectorAll(".screen").forEach(s => s.classList.toggle("on", s.id === id)); }
const fmt = ms => { const s = Math.max(0, Math.ceil(ms / 1000)); return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); };

/* ---------- 시간 보정: 서버 시각을 한 번 받아 내 기기와의 차이를 계산 ---------- */
async function syncClock(ref) {
  const t0 = Date.now();
  await setDoc(ref, { seen: serverTimestamp() }, { merge: true });
  const s = await getDocFromServer(ref);
  const t1 = Date.now();
  offset = s.data().seen.toMillis() - (t0 + t1) / 2;
}

/* ---------- 로그인 / 가입 ---------- */
async function sha(t) {
  if (!crypto.subtle) return t;
  const b = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(t));
  return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, "0")).join("");
}
async function login() {
  const nick = $("nick").value.trim(), pw = $("pw").value, err = m => $("err").textContent = m;
  err("");
  try {
    if (!nick || /^\.+$/.test(nick)) return err("닉네임을 입력해 주세요.");
    if (!pw) return err("비밀번호를 입력해 주세요.");
    const key = nick.toLowerCase();
    const ref = doc(db, "users", encodeURIComponent(key));
    const hash = await sha(key + ":" + pw);
    const snap = await getDoc(ref);
    if (snap.exists() && snap.data().pw !== hash) return err("이미 사용 중인 닉네임이에요. 비밀번호를 확인해 주세요.");
    if (!snap.exists()) await setDoc(ref, { nick, pw: hash, round: 0, floor: 0, state: "none" });
    await syncClock(ref);
    me = { ref, nick, data: (await getDoc(ref)).data() };
    enter();
  } catch (e) { console.error(e); err("접속 실패: Firebase 설정과 Firestore 규칙을 확인해 주세요."); }
}
/* ---------- 관리자 로그인: Firebase Authentication (서버가 비밀번호를 검증) ---------- */
async function adminLogin() {
  const email = $("aEmail").value.trim(), pw = $("aPw").value, err = m => $("aErr").textContent = m;
  err("");
  if (!email || !pw) return err("이메일과 비밀번호를 입력해 주세요.");
  try {
    const cred = await signInWithEmailAndPassword(auth, email, pw);
    if (cred.user.email !== ADMIN_EMAIL) { await signOut(auth); return err("관리자 계정이 아닙니다."); }
    isAdmin = true;
    await syncClock(doc(db, "gameState", "adminClock"));
    enter();
  } catch (e) { console.error(e); err("로그인 실패: 이메일/비밀번호를 확인해 주세요."); }
}
function enter() {
  $("admin").classList.toggle("on", isAdmin);
  onSnapshot(gameRef, s => { // 게임 상태 실시간 동기화
    game = s.exists() ? s.data() : { status: "waiting", round: 0, startAt: 0 };
    render();
  });
  setInterval(tick, 250);
  document.addEventListener("visibilitychange", tick); // 탭 복귀 즉시 보정
  window.addEventListener("focus", tick);
}

/* ---------- 상태에 따라 화면 결정 ---------- */
function curStatus() {
  return game.status === "playing" && nowS() >= endAt() ? "ended" : game.status;
}
function render() {
  const st = curStatus();
  if (isAdmin) $("adminInfo").textContent = "상태: " + st;
  if (st !== "ended" && unsubBoard) { unsubBoard(); unsubBoard = null; boardRound = null; }
  if (st === "waiting") { play = null; $("waitMsg").textContent = "관리자가 게임을 시작할 때까지 대기 중입니다..."; $("waitSub").textContent = ""; show("wait"); }
  else if (st === "playing") {
    if (isAdmin) { $("waitMsg").textContent = "게임 진행 중입니다"; show("wait"); }
    else { initPlay(); show("game"); }
  } else if (st === "ended") {
    show("result");
    if (!isAdmin && play && play.state === "playing") commit("timeout"); // 시간 종료 → 현재 층 자동 확정
    listenBoard();
  }
  tick();
}

/* ---------- 남은 시간 (절대 타임스탬프 기반이라 백그라운드에서도 정확) ---------- */
function tick() {
  if (game.status !== "playing") return;
  const left = endAt() - nowS();
  $("time").textContent = fmt(left);
  $("time").classList.toggle("low", left < 10000);
  $("bar").style.width = Math.max(0, Math.min(100, left / (DURATION * 10))) + "%";
  $("waitSub").textContent = isAdmin ? "남은 시간 " + fmt(left) : "";
  if (left <= 0) {
    if (isAdmin && !adminEnded) { adminEnded = true; setDoc(gameRef, { status: "ended" }, { merge: true }); }
    render();
  }
}

/* ---------- 플레이 ---------- */
const LS = "luckElevatorPlay";
function initPlay() {
  if (play && play.round === game.round) return;
  let saved = null;
  try { saved = JSON.parse(localStorage.getItem(LS)); } catch (e) {}
  if (me.data.round === game.round && me.data.state !== "none") { // 이미 확정한 라운드
    play = { round: game.round, floor: me.data.floor, state: me.data.state, reachedAt: me.data.reachedAt };
  } else if (saved && saved.nick === me.nick && saved.round === game.round) play = saved; // 새로고침 복구
  else play = { nick: me.nick, round: game.round, floor: 1, state: "playing", reachedAt: nowS() };
  adminEnded = false;
  drawFloor(); drawPlayState();
}
function drawFloor() { $("floorNum").textContent = play.floor; $("prog").style.width = play.floor + "%"; }
function drawPlayState() {
  const fin = play.state !== "playing";
  $("play").style.display = fin ? "none" : "block";
  $("done").style.display = fin ? "block" : "none";
  if (fin) {
    $("doneTitle").textContent = play.floor + "층 · " + LABEL[play.state];
    $("doneSub").textContent = "기록이 확정되었습니다. 종료 후 랭킹이 공개돼요.";
  }
}
const save = () => localStorage.setItem(LS, JSON.stringify(play));
function flash(cls) { const f = $("fx"); f.className = ""; void f.offsetWidth; f.className = cls; }

function pick(side) {
  if (busy || !play || play.state !== "playing") return;
  if (nowS() >= endAt()) return render();
  busy = true;
  const el = $(side === "A" ? "dA" : "dB"), ok = Math.random() < 0.5; // 50% 확률
  $("dA").disabled = $("dB").disabled = true;
  el.classList.add("open", ok ? "ok" : "bad");
  el.querySelector(".lbl").textContent = ok ? "↑" : "✕";
  setTimeout(() => {
    if (nowS() >= endAt()) { busy = false; resetDoors(); return render(); }
    if (ok) {
      play.floor++; play.reachedAt = nowS(); save(); drawFloor(); flash("ok");
      const f = $("floorNum"); f.classList.remove("up"); void f.offsetWidth; f.classList.add("up");
      if (play.floor >= MAX_FLOOR) commit("cleared");
    } else {
      flash("bad"); $("floorNum").classList.add("fall");
      setTimeout(() => $("floorNum").classList.remove("fall"), 900);
      commit("fell");
    }
    busy = false; resetDoors();
  }, 650);
}
function resetDoors() {
  for (const [id, t] of [["dA", "A"], ["dB", "B"]]) {
    const d = $(id); d.classList.remove("open", "ok", "bad"); d.disabled = false; d.querySelector(".lbl").textContent = t;
  }
}
/* 기록 확정: DB에는 확정 시점에만 저장 (무료 플랜의 읽기/쓰기 한도 절약) */
async function commit(state) {
  if (play.state !== "playing") return;
  play.state = state; save(); drawFloor(); drawPlayState();
  const rec = { round: play.round, floor: play.floor, state, reachedAt: play.reachedAt };
  try { await setDoc(me.ref, rec, { merge: true }); me.data = { ...me.data, ...rec }; }
  catch (e) { console.error(e); setTimeout(() => setDoc(me.ref, rec, { merge: true }), 2000); }
}

/* ---------- 리더보드 ---------- */
function listenBoard() {
  if (unsubBoard && boardRound === game.round) return;
  if (unsubBoard) unsubBoard();
  boardRound = game.round;
  unsubBoard = onSnapshot(query(collection(db, "users"), where("round", "==", game.round)), s => {
    // 1순위: 높은 층 / 2순위: 그 층에 더 먼저 도달한 사람
    const list = s.docs.map(d => d.data()).sort((a, b) => b.floor - a.floor || a.reachedAt - b.reachedAt);
    const medal = ["🥇", "🥈", "🥉"];
    $("board").innerHTML = list.length ? list.map((u, i) =>
      `<div class="row${me && u.nick === me.nick ? " me" : ""}"><span class="rk">${medal[i] || i + 1}</span>` +
      `<span class="nm"></span><span class="fl">${u.floor}층</span><span class="badge ${u.state}">${LABEL[u.state] || u.state}</span></div>`).join("")
      : '<p class="center mut" style="padding:20px">기록이 없습니다.</p>';
    [...$("board").querySelectorAll(".nm")].forEach((el, i) => el.textContent = list[i].nick); // XSS 방지
    const idx = me ? list.findIndex(u => u.nick === me.nick) : -1;
    $("myRank").textContent = idx >= 0 ? `내 순위 ${idx + 1}위 (전체 ${list.length}명)` : isAdmin ? `참가자 ${list.length}명` : "최종 랭킹";
  });
}

/* ---------- 관리자 버튼 ---------- */
/* 화면에서 막을 뿐 아니라, Firestore 규칙이 관리자 이메일이 아니면 쓰기를 거부합니다. */
const adminWrite = async data => {
  if (!isAdmin || !auth.currentUser) return alert("관리자 로그인이 필요합니다.");
  try { await setDoc(gameRef, data, { merge: true }); }
  catch (e) { console.error(e); alert("권한이 없습니다. Firestore 규칙과 ADMIN_EMAIL 을 확인해 주세요."); }
};
$("bStart").onclick = () => {
  if (curStatus() === "playing" && !confirm("진행 중입니다. 새로 시작할까요?")) return;
  const t = nowS();
  adminWrite({ status: "playing", round: t, startAt: t });
};
$("bEnd").onclick = () => adminWrite({ status: "ended" });
$("bReset").onclick = () => confirm("대기실로 되돌릴까요?") && adminWrite({ status: "waiting", round: 0, startAt: 0 });

$("bToAdmin").onclick = () => show("adminLogin");
$("bBack").onclick = () => show("login");
$("bAdminLogin").onclick = adminLogin;
$("aPw").onkeydown = e => e.key === "Enter" && adminLogin();
$("bLogin").onclick = login;
$("pw").onkeydown = $("nick").onkeydown = e => e.key === "Enter" && login();
$("dA").onclick = () => pick("A");
$("dB").onclick = () => pick("B");
$("bCash").onclick = () => confirm(play.floor + "층에서 확정할까요?") && commit("cashed");
</script>
